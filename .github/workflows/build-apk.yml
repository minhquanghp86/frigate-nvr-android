name: Build APK/AAB

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Không dùng android-actions/setup-android: runner ubuntu-latest đã có Android SDK
      # (và action này đang hỏng vì package "tools" không còn trong SDK repo).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cài SDK platform 36 (yêu cầu Google Play từ 31/08/2026)
        run: |
          SDKDIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=${SDKDIR}" > local.properties
          echo "Dùng SDK: ${SDKDIR}"
          if [ ! -d "${SDKDIR}/platforms/android-36" ]; then
            SDKMGR="$(find "${SDKDIR}/cmdline-tools" -name sdkmanager -type f | head -n1)"
            yes | "${SDKMGR}" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          fi
          ls "${SDKDIR}/platforms"

      - name: Xac dinh version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Bỏ tiền tố v để versionName dạng số (Play ưu tiên semver)
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${V}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V}"

      - name: Build APK + AAB + unit test
        run: ./gradlew assembleRelease bundleRelease testReleaseUnitTest --no-daemon
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frigate-nvr-android-${{ steps.ver.outputs.name }}-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact (dùng để nộp Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: frigate-nvr-android-${{ steps.ver.outputs.name }}-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
