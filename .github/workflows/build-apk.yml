name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Không dùng android-actions/setup-android: runner ubuntu-latest đã có Android SDK
      # (và action này đang hỏng vì package "tools" không còn trong SDK repo).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Trỏ Android SDK
        run: |
          SDKDIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=${SDKDIR}" > local.properties
          echo "Dùng SDK: ${SDKDIR}"
          ls "${SDKDIR}/platforms" 2>/dev/null || true

      - name: Xac dinh version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME}"
          else
            V="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${V}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V}"

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frigate-nvr-android-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
